<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c1210">
  <title>SGB sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    color:#eef6f1;background:#0c1210;font-family:system-ui,sans-serif}.card{width:min(100%,420px);padding:30px;
    border:1px solid #30463b;border-radius:22px;background:#15201b;text-align:center;box-shadow:0 20px 60px #0005}
    .logo{display:block;width:110px;height:110px;object-fit:contain;margin:0 auto 18px}h1{margin:0 0 10px;font-size:1.35rem}
    p{margin:0;color:#afbeb6;line-height:1.55}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:13px;
    color:#fff;background:#1f6f4a;font:inherit;font-weight:800}
  </style>
</head>
<body><main class="card"><img class="logo" src="file:///android_asset/branding/logo-sgb-icon.png" alt="SGB"><h1>Primera conexión necesaria</h1>
  <p>Conéctate a internet una vez para iniciar sesión y descargar la aplicación. Después podrás consultar y registrar información sin señal.</p>
  <button onclick="window.SGBAndroid?.retryHome?.()">Reintentar</button></main></body>
</html>
