<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251c" />
    <meta name="description" content="SGB — Sistema de Gestión Bovina." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>SGB · Sistema de Gestión Bovina</title>
    <script>
      (() => {
        const light = '#f4f7f5';
        const dark = '#0c1210';
        let background = '#10251c';
        try {
          const savedTheme = localStorage.getItem('mm.theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const appearance = JSON.parse(localStorage.getItem('sgb.appearance.v1') || 'null') || {};
          const candidate = theme === 'dark' ? appearance.darkBackground : appearance.lightBackground;
          background = /^#[0-9a-f]{6}$/i.test(candidate) ? candidate : (theme === 'dark' ? dark : light);
          document.documentElement.dataset.theme = theme;
        } catch { /* Se conserva el fondo de arranque de SGB. */ }
        document.documentElement.style.setProperty('--boot-bg', background);
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background);
        try { window.SGBAndroid?.setSystemBarColors?.(background, background); } catch { /* Solo Android. */ }
      })();
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: var(--boot-bg, #10251c); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
