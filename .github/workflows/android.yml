name: Android

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/sgb-v2-interfaz]
    paths: ['android/**', 'frontend/**', '.github/workflows/android.yml']
  push:
    branches: [feature/sgb-v2-android, feature/sgb-v2-interfaz]
    paths: ['android/**', 'frontend/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build bundled frontend
        working-directory: frontend
        run: npm run build
      - name: Configure Chrome for isolated CI tests
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/sgb-test-chrome"
          chmod +x "$RUNNER_TEMP/sgb-test-chrome"
      - name: Verify offline data and mobile screens
        working-directory: frontend
        env:
          CHROME_PATH: ${{ runner.temp }}/sgb-test-chrome
        run: |
          npm run test:offline
          node tests/service-worker.test.mjs
          node tests/cleaning-browser.test.mjs
          node tests/settings-screen.test.mjs
          node tests/reproduction-browser.test.mjs
          node tests/health-browser.test.mjs
          node tests/pastures-browser.test.mjs
          node tests/animal-profile.test.mjs
          node tests/animal-edit.test.mjs
          node tests/session-mode.test.mjs
          node tests/session-startup.test.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and compile debug APK
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sgb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk


